<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Noto Sans CJK JP is pinned by package-lock; Archivo is served by the app. -->
  <dir prefix="cwd">node_modules/@docx-editor.dev/fonts-cjk/assets</dir>
  <cachedir>/tmp/rra-visual-font-cache</cachedir>
  <alias><family>sans-serif</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
</fontconfig>
