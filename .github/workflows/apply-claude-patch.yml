name: Apply Claude Patch

on:
  issue_comment:
    types: [created]

# Only the repository owner can request this. Patch text is never executed as shell code.
permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: claude-patch-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.comment.user.login == 'BrainEno' &&
      startsWith(github.event.comment.body, '/apply-patch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve target branch
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          IS_PR: ${{ toJSON(github.event.issue.pull_request != null) }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$IS_PR" == "true" ]]; then
            pr="$(gh api "repos/$REPO/pulls/$ISSUE_NUMBER")"
            head_ref="$(jq -r '.head.ref' <<<"$pr")"
            head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr")"
            base_ref="$(jq -r '.base.ref' <<<"$pr")"
            if [[ "$head_repo" != "$REPO" ]]; then
              echo "Refusing patches to fork PRs."
              exit 1
            fi
            if [[ "$head_ref" == "main" || "$base_ref" != "main" ]]; then
              echo "Target must be a non-main branch PR targeting main."
              exit 1
            fi
            echo "checkout_ref=$head_ref" >> "$GITHUB_OUTPUT"
            echo "target_branch=$head_ref" >> "$GITHUB_OUTPUT"
            echo "create_pr=false" >> "$GITHUB_OUTPUT"
          else
            echo "checkout_ref=main" >> "$GITHUB_OUTPUT"
            echo "target_branch=claude/patch-$ISSUE_NUMBER-$COMMENT_ID" >> "$GITHUB_OUTPUT"
            echo "create_pr=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out target without persisting credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.checkout_ref }}
          persist-credentials: false

      - name: Create isolated branch for issue-based patches
        if: steps.target.outputs.create_pr == 'true'
        env:
          TARGET_BRANCH: ${{ steps.target.outputs.target_branch }}
        run: git switch --create "$TARGET_BRANCH"

      - name: Extract and validate unified diff
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          PATCH_FILE: ${{ runner.temp }}/claude.patch
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          import sys
          from pathlib import PurePosixPath

          body = os.environ["COMMENT_BODY"]
          matches = re.findall(r"```(?:diff|patch)\s*\n(.*?)\n```", body, re.S)
          if not body.startswith("/apply-patch"):
              sys.exit("Comment must begin with /apply-patch.")
          if len(matches) != 1:
              sys.exit("Add exactly one fenced diff or patch code block.")
          patch = matches[0] + "\n"
          if "GIT binary patch" in patch or "Binary files " in patch:
              sys.exit("Binary patches are not supported.")
          if re.search(r"^(old mode|new mode|rename from|rename to|copy from|copy to) ", patch, re.M):
              sys.exit("File mode changes, renames, and copies are not supported.")

          paths = []
          for line in patch.splitlines():
              if line.startswith(("--- ", "+++ ")):
                  path = line[4:].split("\t", 1)[0]
                  if path == "/dev/null":
                      continue
                  if path.startswith(("a/", "b/")):
                      path = path[2:]
                  p = PurePosixPath(path)
                  if p.is_absolute() or ".." in p.parts:
                      sys.exit(f"Unsafe path in patch: {path}")
                  allowed = (
                      path.startswith("src/")
                      or path.startswith("public/")
                      or path.startswith("docs/")
                      or path in {
                          "README.md", "CLAUDE_WEB_WORKFLOW.md", "package.json",
                          "package-lock.json", "astro.config.mjs", "tsconfig.json",
                          ".gitignore"
                      }
                  )
                  if not allowed:
                      sys.exit(f"Path is outside the patch allowlist: {path}")
                  paths.append(path)

          if not paths or not patch.lstrip().startswith(("diff --git ", "--- ")):
              sys.exit("No valid unified diff file headers found.")
          with open(os.environ["PATCH_FILE"], "w", encoding="utf-8", newline="\n") as f:
              f.write(patch)
          print("Validated patch paths:")
          for path in sorted(set(paths)):
              print(f" - {path}")
          PY
          git apply --check "$PATCH_FILE"
          git apply "$PATCH_FILE"
          git diff --check
          if git diff --quiet; then
            echo "Patch produced no changes."
            exit 1
          fi

      - name: Build patched project before committing
        run: |
          npm ci
          npm run build

      - name: Commit and push reviewed patch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_BRANCH: ${{ steps.target.outputs.target_branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CREATE_PR: ${{ steps.target.outputs.create_pr }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No staged changes to commit."
            exit 1
          fi
          git commit -m "Apply reviewed Claude web patch"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          # GITHUB_TOKEN pushes do not trigger ordinary push/PR workflows, so dispatch validation explicitly.
          gh workflow run validate.yml --repo "$REPO" --ref "$TARGET_BRANCH"
          if [[ "$CREATE_PR" == "true" ]]; then
            gh pr create --repo "$REPO" --base main --head "$TARGET_BRANCH" \
              --title "Claude web patch for issue #$ISSUE_NUMBER" \
              --body "## Summary\n\nApplied a patch explicitly submitted by the repository owner in issue #$ISSUE_NUMBER.\n\n## Validation\n\nThe patched working tree passed `npm ci` and `npm run build` before commit.\n\n## Review\n\nPlease review the complete diff. This workflow does not merge pull requests."
          else
            gh api --method POST "repos/$REPO/issues/$ISSUE_NUMBER/comments" \
              -f body="Claude patch applied to branch $TARGET_BRANCH. The patched working tree passed npm ci and npm run build before the commit. Review the new commit and PR diff; this workflow never merges the PR."
          fi

      - name: Report failure in the originating conversation
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api --method POST "repos/$REPO/issues/$ISSUE_NUMBER/comments" \
            -f body="The Claude patch workflow failed. Inspect the run logs at https://github.com/$REPO/actions/runs/$RUN_ID. No PR is merged automatically; if the push step already ran, review the target branch before retrying."
