name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Run tests (unit, API contract, architecture boundaries)
        run: npm test
      - name: Build Astro site
        run: npm run build
      - name: Test rendered article pages
        run: npm run test:render
      - name: Build static snapshot (demo)
        run: SITE_URL=https://example.invalid STATIC_DEMO=1 node scripts/static-snapshot.mjs
