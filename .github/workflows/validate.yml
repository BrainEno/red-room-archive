name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Run tests (unit, API contract, architecture boundaries)
        run: npm test
      - name: Build Astro site
        run: npm run build
      - name: Test rendered article pages
        run: npm run test:render
      - name: Build static snapshot (demo)
        run: SITE_URL=https://example.invalid STATIC_DEMO=1 node scripts/static-snapshot.mjs

  ui:
    name: Browser UI (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and CJK font
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Build isolated fixtures and test UI
        run: npm run test:ui
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
