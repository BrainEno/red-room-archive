name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Run tests (unit, API contract, architecture boundaries)
        run: npm test
      - name: Build Astro site
        run: npm run build
      - name: Test rendered article pages
        run: npm run test:render
      - name: Build static snapshot (demo)
        run: SITE_URL=https://example.invalid STATIC_DEMO=1 node scripts/static-snapshot.mjs

  ui:
    name: Browser UI (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            projects: --project=small-phone --project=phone --project=breakpoint --project=tablet --project=desktop
          - browser: firefox
            projects: --project=firefox-phone --project=firefox-desktop
          - browser: webkit
            projects: --project=webkit-phone --project=webkit-desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser and CJK font
        run: |
          npx playwright install --with-deps ${{ matrix.browser }}
          sudo apt-get install -y fonts-noto-cjk
      - name: Build isolated fixtures
        run: npm run build && npm run test:ui:prepare
      - name: Test UI
        run: npx playwright test ${{ matrix.projects }}
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-diagnostics-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  visual:
    name: Reviewable visual captures
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - name: Build isolated fixtures
        run: npm run build && npm run test:ui:prepare
      - name: Capture reference candidates
        env:
          FONTCONFIG_FILE: ${{ github.workspace }}/tests/visual/fonts.conf
        run: npm run test:visual:candidates
      - name: Upload visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-candidates
          path: visual-candidates/
          if-no-files-found: warn
          retention-days: 14
